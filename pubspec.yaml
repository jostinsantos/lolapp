name: lolbeta
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  crypto: ^3.0.3
  http: ^1.2.2
  dio: ^5.7.0
  go_router: ^14.2.7
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  cached_network_image: ^3.4.1
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  uuid: ^4.5.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  collection: ^1.18.0
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  flutter_svg: ^2.0.10+1
  flutter_js: ^0.8.1
  video_player: ^2.9.2
  fvp: ^0.38.1
  chewie: ^1.8.5
  libtorrent_flutter: ^2.0.0
  android_intent_plus: ^5.1.0
  webview_flutter: ^4.4.0
  webview_flutter_android: ^3.12.0
  html: ^0.15.4
  wakelock_plus: ^1.2.8
  encrypt: ^5.0.3
  open_filex: ^4.4.0
  permission_handler: ^11.3.0
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^17.2.3
  dart_cast: ^0.7.4
  supabase_flutter: ^2.8.0
  timezone: ^0.9.4
  flutter_foreground_task: ^8.14.0
  device_info_plus: ^11.0.0
  package_info_plus: ^8.1.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/addons/
    - assets/images/
    - assets/redes/
    - assets/js/crypto-js.min.js
    - assets/js/crypto-js.bundle.js
    - assets/js/cheerio.bundle.js
    - assets/logo.png
    - assets/spiner.gif
    - assets/images/vod.png
    - assets/images/tvlive.png
    - assets/images/tmdb.png
    - assets/images/letterboxd.png
    - assets/images/metacritic.png
    - assets/images/imdb.png
    - assets/logo.png
    - assets/spiner.gif

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo.png"
  min_sdk_android: 21
